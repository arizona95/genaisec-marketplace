# 검증자는 action/validators.json 에 등록한다 — 새 검사를 붙일 때 이 파일은 안 고친다.
#
# 잡을 둘로 나눈 건 실패의 뜻이 다르기 때문이다.
#   기본 : 내보내면 안 되는 것(악성지시문·악성코드·유출) → 병합을 막는다.
#   심화 : 판단이 섞이는 영역 → 막지 않고, 태그가 안 붙는 것으로 드러낸다.
#
# PR 은 그 PR 에서 바뀐 자산만 검사한다. action/ · .github/ 가 바뀌면 판정 기준이 바뀐 것이라
# 러너가 알아서 전수로 올린다.
#
# 게이트: 기본검증에 걸린 자산이 있으면 그 PR 은 병합되지 않는다(main 보호 규칙의 필수 체크).
# 다만 git 병합은 전부 아니면 전무라, 걸린 자산만 빼고 나머지는 들어가게 하려면 누군가 걸린 자산을
# PR 에서 빼야 한다. 그걸 게이트가 한다 — 걸린 자산의 폴더와 카탈로그 항목을 지운 커밋을
# PR 브랜치에 붙이고 검사를 다시 건다. 그 커밋 메시지에 무엇이 왜 빠졌는지 남는다.
# (llm-review 는 임시 비활성 — action/validators.json)
name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write        # 게이트가 PR 브랜치에 제외 커밋을 민다
  actions: write         # 그 뒤 검사를 다시 건다

env:
  BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
         || (github.event_name == 'push' && github.event.before || '') }}

jobs:
  basic:
    name: 기본검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 게이트가 push 할 때 PR 헤드 브랜치를 그대로 쓴다(merge 커밋 아님).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          # PAT(GH_PAT)가 있으면 게이트의 push 가 워크플로를 다시 트리거한다. 없으면 GITHUB_TOKEN 으로 밀고 직접 다시 건다.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet ruff detect-secrets
      - name: rebase-guard
        if: github.event_name == 'pull_request'
        run: python action/scripts/rebase_guard.py --base "origin/${{ github.base_ref }}"
      - name: 카탈로그 일관성
        run: |
          python action/scripts/sync_catalog.py --check
          python action/scripts/validate_catalog.py
      - name: 기본검증
        id: basic
        run: |
          python action/scripts/run_validators.py --tier basic --changed-since "$BASE" --failed-out /tmp/failed.json \
            && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
          test -f /tmp/failed.json || echo '{}' > /tmp/failed.json
          echo "failed=$(python -c 'import json;print(len(json.load(open("/tmp/failed.json"))))')" >> "$GITHUB_OUTPUT"

      # 게이트. 같은 저장소 PR 에서만(포크 PR 은 밀 수 없고, 사람이 볼 일이다).
      - name: 게이트 — 걸린 자산을 PR 에서 빼는 커밋
        if: >
          steps.basic.outputs.ok == 'false' && steps.basic.outputs.failed != '0' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          python action/scripts/gate_exclude.py /tmp/failed.json --write
          git config user.name  genaisec-gate
          git config user.email genaisec-gate@users.noreply.github.com
          git add -A
          git commit -qF /tmp/gate-msg.txt
          git push -q origin "HEAD:$HEAD_REF"
          echo "게이트: 걸린 자산 $(python -c 'import json;print(len(json.load(open("/tmp/failed.json"))))')개를 PR #$PR 에서 뺐다. 검사를 다시 건다." >> "$GITHUB_STEP_SUMMARY"
          # GITHUB_TOKEN 의 push 는 워크플로를 트리거하지 않는다 — 직접 다시 건다.
          if [ "$HAS_PAT" != "true" ]; then
            gh workflow run ci --ref "$HEAD_REF" --repo "$GITHUB_REPOSITORY"
            gh workflow run history --ref "$HEAD_REF" --repo "$GITHUB_REPOSITORY" -f pr="$PR"
          fi
      - name: 판정
        if: steps.basic.outputs.ok == 'false'
        run: |
          echo "기본검증 실패 — 이 커밋은 병합되지 않는다. (걸린 자산은 게이트가 뺐다면 다음 검사에서 통과한다)"
          exit 1

  deep:
    name: 심화검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet black
      - name: 심화검증 실행
        continue-on-error: true
        run: |
          python action/scripts/run_validators.py --tier deep \
            --changed-since "$BASE" | tee deep.log
          {
            echo '### 심화검증 결과'
            echo '```'
            tail -n 14 deep.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 병합 뒤 dev 를 main 으로 fast-forward 한다. 브랜치는 main·dev 둘뿐이고 dev→main 만 병합하므로,
  # merge 커밋 병합이면 dev 는 항상 main 의 조상이라 fast-forward 가 된다(force 아님).
  # dev 에 그 사이 새 커밋이 있으면 그냥 실패하고 넘어간다 — 다음 PR 이 알아서 따라잡는다.
  sync-dev:
    name: dev ← main fast-forward
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: fast-forward
        continue-on-error: true
        run: |
          git push origin HEAD:dev && echo "dev 를 main($(git rev-parse --short HEAD))으로 맞췄다" >> "$GITHUB_STEP_SUMMARY"             || echo "dev 에 새 커밋이 있어 fast-forward 하지 않았다" >> "$GITHUB_STEP_SUMMARY"
