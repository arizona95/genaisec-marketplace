# 검사 이력은 사람이 쓰지 않는다 — 이 워크플로만 `history` 브랜치에 쓴다. UI(ui/server.py)는 그 브랜치를 읽는다.
#
# 로그는 PR 단위다. PR 이 열리거나 갱신될 때 **그 PR 에서 바뀐 자산만** 검사해 `pr/` 에 기록한다.
# PR 하나에 자산 3개가 바뀌었으면 레코드 하나에 자산 3개 — UI 는 그걸 3줄로 찍는다. 같은 PR 에
# 다시 push 하면 헤드 해시가 다른 레코드가 하나 더 남는다(run_id = pr<번호>-<헤드해시>).
#
# main 에 push 되면(=병합) 등록 현황을 위해 `main/` 을 갱신한다. 직전 태그를 이어받아 바뀐
# 자산만 다시 잰다. 주 1회 전수.
#
# 레이아웃 (history 브랜치):
#   pr/index.json · pr/runs/<run_id>.json      PR 로그 (헤드 해시·PR 번호·자산별 판정)
#   main/latest.json · main/index.json · main/runs/ · main/marks.json   등록 현황
name: history
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# history 브랜치에 동시에 push 하면 충돌한다 — 직렬화한다.
concurrency:
  group: history
  cancel-in-progress: false

jobs:
  record:
    name: 이력 기록 → history 브랜치
    # 포크 PR 은 토큰이 읽기 전용이라 기록할 수 없다(검사는 ci.yml 이 한다).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      IS_PR: ${{ github.event_name == 'pull_request' }}
      PR_NUM: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      # PR 은 base 와 비교(=그 PR 에서 바뀐 자산만), push 는 직전 커밋과 비교, 그 외는 전수.
      BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || '') }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet ruff detect-secrets black

      - name: 기록 위치·실행 id
        run: |
          if [ "$IS_PR" = "true" ]; then
            echo "OUT=pr" >> "$GITHUB_ENV"
            echo "RUN_ID=pr${PR_NUM}-${PR_HEAD::7}" >> "$GITHUB_ENV"
            echo "EXTRA=--pr $PR_NUM --pr-url $PR_URL --head-sha $PR_HEAD --head-branch $PR_BRANCH" >> "$GITHUB_ENV"
          else
            echo "OUT=main" >> "$GITHUB_ENV"
            echo "RUN_ID=$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            echo "EXTRA=" >> "$GITHUB_ENV"
          fi

      - name: history 브랜치 워크트리
        run: |
          set -e
          git config user.name  github-actions
          git config user.email github-actions@users.noreply.github.com
          if git ls-remote --exit-code --heads origin history >/dev/null 2>&1; then
            git fetch -q origin history
            git worktree add -q /tmp/hist -B history origin/history
          else
            git worktree add -q --detach /tmp/hist
            git -C /tmp/hist checkout -q --orphan history
            git -C /tmp/hist read-tree --empty
            git -C /tmp/hist clean -fdq
          fi
          mkdir -p "/tmp/hist/$OUT"
          # main 은 직전 태그를 이어받는다. PR 은 이어받지 않는다 — 바뀐 자산만 레코드에 남아야 한다.
          if [ "$IS_PR" != "true" ] && [ -f "/tmp/hist/main/marks.json" ]; then
            cp /tmp/hist/main/marks.json action/marks.json
          fi

      - name: 1/2 기본검증 → 즉시 기록
        run: |
          python action/scripts/run_validators.py --tier basic --write --changed-since "$BASE" || true
          test -f action/marks.json || echo '{}' > action/marks.json
          python action/scripts/emit_history.py --out "/tmp/hist/$OUT" --run-id "$RUN_ID" --pr-title "$PR_TITLE" $EXTRA
          if [ "$IS_PR" != "true" ]; then cp action/marks.json /tmp/hist/main/marks.json; fi
          bash action/scripts/push_history.sh "$OUT" "1/2 기본 $RUN_ID"

      - name: 2/2 심화검증 → 같은 레코드 덮어쓰기
        run: |
          python action/scripts/run_validators.py --tier deep --write --changed-since "$BASE" || true
          python action/scripts/emit_history.py --out "/tmp/hist/$OUT" --run-id "$RUN_ID" --pr-title "$PR_TITLE" $EXTRA
          if [ "$IS_PR" != "true" ]; then cp action/marks.json /tmp/hist/main/marks.json; fi
          bash action/scripts/push_history.sh "$OUT" "2/2 심화 $RUN_ID"