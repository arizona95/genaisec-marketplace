# 병합된 업로드 브랜치를 지운다 — 사람이 병합했을 때만 돈다.
#
# 대시보드 업로드는 PR 마다 `upload/<이름>-<시각>` 브랜치를 만든다. auto-merge 를 GITHUB_TOKEN 이
# 예약하면 병합 주체가 github-actions[bot] 이 되는데, 토큰이 일으킨 이벤트는 워크플로를 깨우지
# 않아 이 워크플로도 delete_branch_on_merge 도 안 돈다(2026-09-10 PR #8·#9·#11 실측). 그 경우는
# 대시보드 서버(ui/server.py 의 sweep_uploads)가 소유자 gh 자격으로 지운다. 이 파일은 사람이 직접
# 병합했을 때의 보조 경로다.
#
# dev 는 절대 지우지 않는다 — 상시 브랜치다. upload/ 접두만 대상이고, 병합된 PR 만 대상이다
# (닫혔지만 병합 안 된 PR 의 브랜치는 사람이 볼 수 있게 남긴다).
name: cleanup-branch
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'upload/')
    steps:
      - name: 브랜치 삭제
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$REF" \
            && echo "삭제: $REF (PR #${{ github.event.pull_request.number }} 병합됨)" >> "$GITHUB_STEP_SUMMARY" \
            || echo "이미 없음: $REF" >> "$GITHUB_STEP_SUMMARY"
