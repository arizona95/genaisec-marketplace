<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>genaisec marketplace</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1a1d21;--muted:#697077;--line:#e3e6ea;--head:#f0f2f5;
  --ok:#1a7f4b;--okbg:#e7f5ec;--bad:#c0392b;--badbg:#fdecea;--wait:#8a6d3b;--waitbg:#fcf3e2;
  --skill:#2d6cdf;--plugin:#7a3ff2;--mcp:#0d8f8f;--accent:#2d6cdf;--sel:#eef3ff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1216;--panel:#171b21;--ink:#e6e9ee;--muted:#9aa4af;--line:#262c34;--head:#1d222a;
  --ok:#4cc38a;--okbg:#12301f;--bad:#f07167;--badbg:#3a1512;--wait:#e0b25a;--waitbg:#332810;--skill:#6aa0ff;--plugin:#b98cff;--mcp:#3fd0d0;--accent:#6aa0ff;--sel:#1b2436}}
:root[data-theme=dark]{--bg:#0f1216;--panel:#171b21;--ink:#e6e9ee;--muted:#9aa4af;--line:#262c34;--head:#1d222a;
  --ok:#4cc38a;--okbg:#12301f;--bad:#f07167;--badbg:#3a1512;--wait:#e0b25a;--waitbg:#332810;--skill:#6aa0ff;--plugin:#b98cff;--mcp:#3fd0d0;--accent:#6aa0ff;--sel:#1b2436}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:18px 18px 50px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:10px}
h1{font-size:18px;margin:0}
h1 .sub{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:8px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
select,button,input[type=search]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:transparent}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.live.off{background:var(--bad)}
.ci{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.chip{font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.chip.run{border-color:var(--wait);color:var(--wait)}.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.fail{border-color:var(--bad);color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);padding:8px 14px;font-weight:600}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar input[type=search]{flex:1;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel);color:var(--muted);padding:6px 11px}
.seg button.on{background:var(--accent);color:#fff}
.stat{color:var(--muted);font-size:12.5px}.stat b{color:var(--ink)}
.install{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-bottom:10px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.install code{flex:1;overflow:auto;white-space:nowrap}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{background:var(--head);color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--sel)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sel)}
td.desc{white-space:normal;max-width:420px;color:var(--muted);font-size:12.5px}
td.src{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted)}
.type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;border-radius:5px;color:#fff}
.type.skill{background:var(--skill)}.type.plugin{background:var(--plugin)}.type.mcp{background:var(--mcp)}
.st{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px}
.st.ok{background:var(--okbg);color:var(--ok)}.st.bad{background:var(--badbg);color:var(--bad)}.st.wait{background:var(--waitbg);color:var(--wait)}
.marks{display:inline-flex;gap:4px}
.m{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 6px;border-radius:5px;border:1px solid var(--line);cursor:default}
.m.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.m.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.m.wait{background:var(--waitbg);color:var(--wait);border-color:transparent}
.m .t{font-size:8.5px;opacity:.7;text-transform:uppercase}
.empty{padding:22px;color:var(--muted);text-align:center}
.detail{margin-top:14px}
.detail h3{font-size:14px;margin:0 0 6px}
.meta{color:var(--muted);font-size:12px;margin-bottom:8px}.meta code{background:var(--head);border-radius:4px;padding:1px 5px}
.v{font-weight:700}.v.passed{color:var(--ok)}.v.blocked{color:var(--bad)}
.err{background:var(--badbg);color:var(--bad);padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>genaisec marketplace <span class="sub">검증 대시보드</span></h1>
    <label>브랜치 <select id="branch"></select></label>
    <div class="sync">
      <span class="live" id="live" title="실시간 연결"></span>
      <span id="syncmsg">동기화 중…</span>
      <button id="refresh">새로고침</button>
    </div>
  </header>
  <div class="ci" id="ci"></div>
  <div id="err"></div>
  <div class="tabs">
    <button data-tab="status" class="on">등록 현황</button>
    <button data-tab="log">로그</button>
  </div>

  <section id="tab-status">
    <div class="install"><span>설치</span><code id="install"></code><button id="copy">복사</button></div>
    <div class="bar">
      <input type="search" id="q" placeholder="이름·설명 검색…">
      <div class="seg" id="ftype"><button data-v="all" class="on">전체</button><button data-v="skill">skill</button><button data-v="mcp">mcp</button><button data-v="plugin">plugin</button></div>
      <div class="seg" id="fstat"><button data-v="all" class="on">모두</button><button data-v="registered">등록</button><button data-v="blocked">차단</button></div>
      <span class="stat" id="stat"></span>
    </div>
    <div class="tbl"><table>
      <thead><tr><th>종류</th><th>이름</th><th>버전</th><th>설명</th><th>상태</th><th>검사</th><th>소스</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>

  <section id="tab-log" hidden>
    <div class="tbl"><table>
      <thead><tr><th>시각(UTC)</th><th>브랜치</th><th>커밋</th><th>실행자</th><th>트리거</th><th>rebase</th><th>판정</th><th>자산</th><th>등록</th><th>차단</th><th>완전검증</th><th>CI</th></tr></thead>
      <tbody id="runs"></tbody>
    </table></div>
    <div class="detail" id="detail"></div>
  </section>
</div>
<script>
const ORDER = {skill:0, mcp:1, plugin:2};
const S = {branch:"main", tab:"status", type:"all", stat:"all", q:"", state:null, catalog:null, latest:null, index:[], run:null, runId:null};
const $ = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const typeOf = t => (t||"").split("/")[0].replace(/s$/,"");
const ago = iso => { if(!iso) return "–"; const s=Math.max(0,(Date.now()-Date.parse(iso))/1000|0); return s<60?`${s}초 전`:s<3600?`${s/60|0}분 전`:`${s/3600|0}시간 전`; };

async function j(url, opt){ const r = await fetch(url, {cache:"no-store", ...(opt||{})}); if(!r.ok) throw new Error(`${r.status} ${url}`); return r.json(); }

async function loadState(){
  S.state = await j("/api/state");
  const sel = $("branch"), cur = S.branch;
  sel.innerHTML = S.state.branches.map(b=>`<option ${b===cur?"selected":""}>${esc(b)}</option>`).join("");
  if(!S.state.branches.includes(cur) && S.state.branches.length){ S.branch = S.state.branches.includes("main")?"main":S.state.branches[0]; sel.value=S.branch; }
  paintSync();
}
function paintSync(){
  const st = S.state; if(!st) return;
  const head = st.heads[S.branch]||"?";
  $("syncmsg").innerHTML = `동기화 ${ago(st.synced_at)} · origin/${esc(S.branch)} <code>${esc(head)}</code>` + (st.history_branch?"":" · <b>이력 없음(CI 대기)</b>") + (st.last_error?` · <span style="color:var(--bad)">fetch 실패</span>`:"");
  $("ci").innerHTML = (st.ci||[]).slice(0,6).map(r=>{
    const cls = r.status!=="completed"?"run":(r.conclusion==="success"?"ok":"fail");
    const label = r.status!=="completed"?"진행 중":(r.conclusion||"?");
    return `<a class="chip ${cls}" href="${esc(r.url)}" target="_blank">${esc(r.name)} · ${esc(r.branch)} @${esc(r.sha)} · ${label}</a>`;
  }).join("");
}

async function loadStatus(){
  const b = encodeURIComponent(S.branch);
  const [cat, latest] = await Promise.all([
    j(`/api/catalog?branch=${b}`).catch(()=>null),
    j(`/api/history/latest?branch=${b}`).catch(()=>null),
  ]);
  S.catalog = cat; S.latest = latest;
  $("install").textContent = "/plugin marketplace add https://github.com/arizona95/genaisec-marketplace.git";
  paintStatus();
}
function paintStatus(){
  const hist = {}; ((S.latest||{}).assets||[]).forEach(a=>hist[a.target]=a);
  const vals = (S.latest||{}).validators||[];
  let rows = ((S.catalog||{}).plugins||[]).map(p=>{
    const src = (p.source||"").replace(/^\.\//,""); const h = hist[src];
    const type = (p.hub||{}).type || typeOf(src);
    const status = !h ? "wait" : (h.registered ? "ok" : "bad");
    return {type, name:p.name, version:p.version||"", desc:p.description||"", src, status, checks:h?h.checks:vals.map(v=>({validator:v.name,tier:v.tier,version:"",ok:false,title:v.description}))};
  });
  rows.sort((a,b)=>(ORDER[a.type]??9)-(ORDER[b.type]??9) || a.name.localeCompare(b.name));
  const q=S.q.toLowerCase();
  const shown = rows.filter(r=>(S.type==="all"||r.type===S.type)&&(S.stat==="all"||(S.stat==="registered"?r.status==="ok":r.status==="bad"))&&(!q||r.name.toLowerCase().includes(q)||r.desc.toLowerCase().includes(q)));
  const n = {ok:0,bad:0,wait:0}; rows.forEach(r=>n[r.status]++);
  $("stat").innerHTML = `<b>${rows.length}</b> 자산 · 등록 <b>${n.ok}</b> · 차단 <b>${n.bad}</b> · 검사 전 <b>${n.wait}</b> · 표시 ${shown.length}`;
  $("rows").innerHTML = shown.map(r=>`<tr>
    <td><span class="type ${r.type}">${esc(r.type)}</span></td>
    <td><b>${esc(r.name)}</b></td><td>${esc(r.version)}</td>
    <td class="desc">${esc(r.desc)}</td>
    <td><span class="st ${r.status}">${r.status==="ok"?"등록":r.status==="bad"?"차단":"검사 전"}</span></td>
    <td>${marks(r.checks)}</td>
    <td class="src">${esc(r.src)}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">${S.catalog?"해당하는 자산이 없습니다.":"origin/"+esc(S.branch)+" 에 카탈로그가 없습니다."}</td></tr>`;
  if(!S.latest) $("err").innerHTML = `<div class="err">이력이 아직 없습니다 — CI(history.yml)가 origin/${esc(S.branch)} 첫 실행을 마치면 채워집니다. 상태는 '검사 전'으로 표시합니다.</div>`; else $("err").innerHTML="";
}
function marks(checks){
  return `<span class="marks">${(checks||[]).map(c=>{const cl=!c.version?"wait":(c.ok?"ok":"bad");const sym=cl==="ok"?"✓":cl==="bad"?"✗":"⏳";
    return `<span class="m ${cl}" title="${esc(c.title||"")} ${c.version?"· "+esc(c.version):"· 미실행"}">${sym} ${esc(c.validator)} <span class="t">${esc(c.tier)}</span></span>`;}).join("")}</span>`;
}

async function loadLog(){
  const b = encodeURIComponent(S.branch);
  S.index = await j(`/api/history/index?branch=${b}`).catch(()=>[]);
  if(!S.runId || !S.index.some(e=>e.run_id===S.runId)) S.runId = S.index[0]?.run_id||null;
  paintRuns();
  await loadRun();
}
function paintRuns(){
  $("runs").innerHTML = S.index.map(e=>{const s=e.summary||{}, br=e.branch||{};return `<tr class="click ${e.run_id===S.runId?"sel":""}" data-id="${esc(e.run_id)}">
    <td>${esc((e.at||"").replace("T"," ").replace("+00:00",""))}</td><td>${esc(br.head||"")}</td>
    <td title="${esc(br.head_subject||"")}"><code>${esc(br.head_sha||"")}</code> ${esc((br.head_subject||"").slice(0,40))}</td>
    <td>${esc(e.actor||"")}</td><td>${esc(e.trigger||"")}</td><td>${esc(e.rebase_guard||"")}</td>
    <td class="v ${e.verdict}">${e.verdict==="passed"?"통과":"차단"}</td>
    <td>${s.assets??""}</td><td>${s.registered??""}</td><td>${s.blocked??""}</td><td>${s.fully_verified??""}</td>
    <td>${e.run_url?`<a href="${esc(e.run_url)}" target="_blank">로그</a>`:""}</td></tr>`;}).join("")
    || `<tr><td colspan="12" class="empty">이력이 아직 없습니다 — CI(history.yml)가 첫 실행을 마치면 채워집니다.</td></tr>`;
}
async function loadRun(){
  if(!S.runId){ $("detail").innerHTML=""; return; }
  S.run = await j(`/api/history/run?branch=${encodeURIComponent(S.branch)}&id=${encodeURIComponent(S.runId)}`).catch(()=>null);
  paintRun();
}
function paintRun(){
  const r = S.run; if(!r){ $("detail").innerHTML=""; return; }
  const b=r.branch||{}, rg=r.rebase_guard||{}, s=r.summary||{};
  const assets = (r.assets||[]).map(a=>({...a, type:typeOf(a.target)})).sort((x,y)=>(ORDER[x.type]??9)-(ORDER[y.type]??9)||x.target.localeCompare(y.target));
  $("detail").innerHTML = `<h3>실행 <code>${esc(r.run_id)}</code> <span class="v ${r.verdict}">${r.verdict==="passed"?"통과":"차단"}</span></h3>
    <div class="meta">${esc(r.at)} · ${esc(r.actor)} · ${esc(r.trigger)} · <code>${esc(b.head)}</code>@<code>${esc(b.head_sha)}</code> “${esc(b.head_subject)}” · rebase-guard: ${esc(rg.status)}${rg.behind&&rg.behind.length?` (main 에만 ${rg.behind.length}개)`:""} · 자산 ${s.assets} / 등록 ${s.registered} / 차단 ${s.blocked} / 완전검증 ${s.fully_verified}${r.run_url?` · <a href="${esc(r.run_url)}" target="_blank">CI 로그</a>`:""}</div>
    <div class="tbl"><table><thead><tr><th>종류</th><th>자산</th><th>상태</th><th>마크</th><th>검사</th><th>태그</th></tr></thead><tbody>
    ${assets.map(a=>`<tr><td><span class="type ${a.type}">${esc(a.type)}</span></td><td><b>${esc(a.target)}</b></td>
      <td><span class="st ${a.registered?"ok":"bad"}">${a.registered?"등록":"차단"}</span></td><td>${esc(a.marks)}</td>
      <td>${marks(a.checks)}</td><td class="src">${esc((a.tags||[]).join(" "))}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">자산 없음</td></tr>`}
    </tbody></table></div>`;
}

async function reloadAll(){
  try{ await loadState(); if(S.tab==="status") await loadStatus(); else await loadLog(); $("live").classList.remove("off"); }
  catch(e){ $("err").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function showTab(t){ S.tab=t; document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t)); $("tab-status").hidden=t!=="status"; $("tab-log").hidden=t!=="log"; reloadAll(); }

document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) showTab(b.dataset.tab);});
$("branch").addEventListener("change",e=>{S.branch=e.target.value; S.runId=null; reloadAll();});
$("refresh").addEventListener("click",async()=>{ $("syncmsg").textContent="fetch 중…"; try{ await j("/api/refresh",{method:"POST"}); }catch(_){} reloadAll(); });
$("copy").addEventListener("click",()=>navigator.clipboard.writeText($("install").textContent));
$("q").addEventListener("input",e=>{S.q=e.target.value; paintStatus();});
for(const [id,key] of [["ftype","type"],["fstat","stat"]]) $(id).addEventListener("click",e=>{const b=e.target.closest("button"); if(!b)return; S[key]=b.dataset.v; [...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b)); paintStatus();});
$("runs").addEventListener("click",e=>{const tr=e.target.closest("tr[data-id]"); if(!tr)return; S.runId=tr.dataset.id; paintRuns(); loadRun();});

// 실시간: 서버가 origin 참조 변화를 SSE 로 알리면 다시 읽는다. 끊기면 재접속.
function listen(){
  const es = new EventSource(`/api/events?since=${S.state?S.state.version:0}`);
  es.onmessage = ()=>reloadAll();
  es.onerror = ()=>{ $("live").classList.add("off"); es.close(); setTimeout(listen, 3000); };
}
setInterval(paintSync, 5000);
reloadAll().then(listen);
</script>
</body>
</html>
