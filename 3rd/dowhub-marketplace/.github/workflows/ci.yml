# 검증자는 .github/validators.json 에 등록한다 — 새 검사를 붙일 때 이 파일은 안 고친다.
#
# 잡을 둘로 나눈 건 실패의 뜻이 다르기 때문이다.
#   기본 : 깨진 배포물. 내보내면 사용자 쪽에서 안 돌아간다 → 병합을 막는다.
#   심화 : 판단이 섞이는 영역 → 막지 않고, 태그가 안 붙는 것으로 드러낸다.
#
# 매번 전 자산을 돌리지 않는다. 손대지 않은 자산까지 다시 도는 건 낭비이기도 하지만,
# 무관한 자산 때문에 내 PR 이 빨개지는 게 더 나쁘다. 단 .github/ 가 바뀌면 판정 기준이
# 바뀐 것이라 러너가 알아서 전수로 올린다(옛 기준으로 받은 태그가 남으면 안 되므로).
name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'        # 주 1회 전수 — 도구·취약점DB 가 올라가면 판정이 바뀐다
  workflow_dispatch:

permissions:
  contents: read

env:
  # PR 은 base 와 비교, push 는 직전 커밋과 비교. 그 외(스케줄·수동)는 빈 값 = 전수.
  BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
         || (github.event_name == 'push' && github.event.before || '') }}

jobs:
  basic:
    name: 기본검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # 변경 비교에 이력이 필요하다
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet ruff detect-secrets pip-audit
      # 저장소 불변식: 자산 폴더가 안 바뀌어도 항상 돈다. 카탈로그만 손대면 자산 검사는
      # 건너뛰므로, 이게 없으면 카드 값이 실제와 어긋나도 CI 가 그냥 통과한다
      # (aar-plugin 이 1.0.15 인데 카드는 1.0.14 였던 게 그렇게 살아남았다).
      - name: 카탈로그 일관성
        run: |
          python .github/scripts/sync_catalog.py --check
          python .github/scripts/validate_catalog.py
      # 🚨 배포물이 클라이언트에 어떻게 보이는지는 **공식 도구**만 안다. 우리 검사(ruff·시크릿·
      #    SAST)는 전부 통과하는데 claude.ai 목록에서만 항목이 사라지던 일이 있었다
      #    (이름이 kebab-case 가 아니면 동기화가 조용히 거부한다). 공식 도구가 있으면 돌리고,
      #    없으면 건너뛴다 — 우리 규칙은 validate_catalog.py 가 이미 독립으로 지킨다.
      - name: 공식 플러그인 검증 (있으면)
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate . 2>&1 | tee /tmp/pv.txt
            # 'hub' 는 우리 확장 필드라 무시. 그 외 경고는 실패로 본다.
            if grep -v "Unknown field 'hub'" /tmp/pv.txt | grep -q "❯"; then
              echo "::error::claude plugin validate 가 'hub' 외의 경고를 냈다 — 위 목록을 고쳐라"
              exit 1
            fi
          else
            echo "claude CLI 없음 — 공식 검증 생략(validate_catalog.py 가 같은 규칙을 지킨다)"
          fi
      - run: python .github/scripts/run_validators.py --tier basic --changed-since "$BASE"

  deep:
    name: 심화검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet black
      # 심화는 떨어져도 CI 를 세우지 않는다. 결과는 요약으로만 남긴다.
      # 태그(marks) 기록은 여기서 하지 않는다 — main 병합 뒤 marks.yml 이 전수로 재고 `marks` 브랜치에 쓴다.
      - name: 심화검증 실행
        continue-on-error: true
        run: |
          python .github/scripts/run_validators.py --tier deep \
            --changed-since "$BASE" | tee deep.log
          {
            echo '### 심화검증 결과'
            echo '```'
            tail -n 14 deep.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
